          <div class="col-md-3"><label class="form-label">Stock</label><input type="number" class="form-control" id="prodStock"></div>

        </div>
        <div class="mt-4 d-flex gap-2">

          <button type="button" class="btn btn-outline-secondary fw-bold" id="btnCancelar">Cancelar</button>
        </div>
      </div>
    </div>


    <div class="row g-3" id="cuadriculaProductos"></div>

  </main>

  const KEY_PRODUCTOS = "inv_productos";

  const LIMITE_JUEGO = 3;

  let esAdmin = false;
  let carrito = [];
  let KEY_CARRITO = "";


  function cerrarFormulario() {
    document.getElementById("panelForm").classList.add("d-none");
    document.getElementById("errorForm").classList.add("d-none");
  }


  function limpiarFormulario() {
    document.getElementById("prodId").value = "";
    document.getElementById("prodCodigo").value = "";
    document.getElementById("prodNombre").value = "";
    document.getElementById("prodCategoria").value = "";
    document.getElementById("prodPrecio").value = "";
    document.getElementById("prodStock").value = "";
    document.getElementById("prodImagen").value = "";
    document.getElementById("prodActivo").checked = true;
    document.getElementById("errorForm").classList.add("d-none");
  }

  function siguienteId() {
    let mayor = 0;

    for (let i = 0; i < productos.length; i++) {
      if (productos[i].id > mayor) {
        mayor = productos[i].id;
      }
    }
    return mayor + 1;
  }


  const sesion = leerSesion();

  if (!sesion) {
    window.location.replace("login.html");
  } else {
    esAdmin = sesion.rol === "admin";

    document.getElementById("navUsuario").textContent = "Hola, " + sesion.usuario;

    if (esAdmin) {
      document.getElementById("subtitulo").textContent =
        "Puedes crear, editar y eliminar productos.";
      document.getElementById("btnNuevo").classList.remove("d-none");

      document.getElementById("subtitulo").textContent =
        "Explora nuestro inventario y añade lo que necesites a tu carrito.";
    }

    productos = cargarProductos();
    llenarCategorias();


    KEY_CARRITO = "inv_carrito_" + sesion.usuario;
    carrito = cargarCarrito();


    const parametrosURL = new URLSearchParams(window.location.search);

    if (parametrosURL.has("buscar")) {
      document.getElementById("buscador").value =
        parametrosURL.get("buscar");
    }

    pintarCuadricula();
    pintarCarrito();


    document.getElementById("btnSalir").addEventListener("click", cerrarSesion);
    document.getElementById("buscador").addEventListener("input", pintarCuadricula);

    });

        mostrarError("El stock debe contener solo números");
      }
    });

  function leerSesion() {
    try {
      const texto = sessionStorage.getItem(KEY_SESION);

      if (!texto) {
        return null;
      }

      const sesion = JSON.parse(texto);

      if (!sesion.usuario || !sesion.rol) {
        return null;
      }

      if (sesion.expire && Date.now() > sesion.expire) {
        sessionStorage.removeItem(KEY_SESION);
        return null;
      }

      return sesion;
    } catch (error) {
      return null;
    }
  }


  function cerrarSesion() {
    sessionStorage.removeItem(KEY_SESION);
    window.location.replace("login.html");
  }

  function cargarProductos() {
    const guardados = localStorage.getItem(KEY_PRODUCTOS);

    if (guardados) {
      return JSON.parse(guardados);
    }

    localStorage.setItem(KEY_PRODUCTOS, JSON.stringify(SEED_PRODUCTOS));


    return SEED_PRODUCTOS.slice();
  }


  function guardarProductos() {
    localStorage.setItem(KEY_PRODUCTOS, JSON.stringify(productos));
  }


  function llenarCategorias() {
    const select = document.getElementById("filtroCategoria");
    const datalist = document.getElementById("sugerencias");


    const seleccionada = select.value;

    const categorias = [];

  
    for (let i = 0; i < productos.length; i++) {
      const categoria = productos[i].categoria;

   
      if (categorias.indexOf(categoria) === -1) {
        categorias.push(categoria);
      }
    }

    categorias.sort();


    select.innerHTML = '<option value="">Todas las categorías</option>';
    datalist.innerHTML = "";


    for (let i = 0; i < categorias.length; i++) {
      const opcion = document.createElement("option");

      opcion.value = categorias[i];
      opcion.textContent = categorias[i];

      select.appendChild(opcion);

      const sugerencia = document.createElement("option");
      sugerencia.value = categorias[i];

      datalist.appendChild(sugerencia);
    }


    select.value = seleccionada;
  }


  function imagenProducto(producto) {
    return "https://placehold.co/400x250/ffffff/000000?text=" +
      encodeURIComponent(producto.codigo);
  }



  function pintarCuadricula() {
    const contenedor = document.getElementById("cuadriculaProductos");
    const buscador = document.getElementById("buscador");
    const filtro = document.getElementById("filtroCategoria");

    const textoBuscado = buscador.value.toLowerCase();
    const categoriaBuscada = filtro.value;

    contenedor.innerHTML = "";

    let mostrados = 0;

    for (let i = 0; i < productos.length; i++) {
      const producto = productos[i];


      const textoProducto =
        (producto.codigo + " " +
         producto.nombre + " " +
         producto.categoria).toLowerCase();


      let coincideTexto = false;

      if (textoProducto.indexOf(textoBuscado) !== -1) {
        coincideTexto = true;
      }


      let coincideCategoria = false;

      if (categoriaBuscada === "" ||
          producto.categoria === categoriaBuscada) {
        coincideCategoria = true;
      }


      if (producto.stock <= 0 && !esAdmin) {
        continue;
      }


      if (!coincideTexto || !coincideCategoria) {
        continue;
      }


      const columna = document.createElement("div");
      columna.className = "col-6 col-sm-4 col-md-3 col-xl-2";

      const tarjeta = document.createElement("div");
      tarjeta.className = "card h-100 shadow-sm bg-white text-dark border-0";

      
      const contenedorImagen = document.createElement("div");
      contenedorImagen.style.backgroundColor = "#fff";
      contenedorImagen.style.padding = "10px";
      contenedorImagen.style.height = "160px";
      contenedorImagen.className =
        "d-flex align-items-center justify-content-center rounded-top border-bottom border-light";

      const imagen = document.createElement("img");

      if (producto.imagen && producto.imagen.trim() !== "") {
        imagen.src = producto.imagen;
      } else {
        imagen.src = imagenProducto(producto);
      }

      imagen.alt = producto.nombre;
      imagen.style.maxHeight = "100%";
      imagen.style.maxWidth = "100%";
      imagen.style.objectFit = "contain";

      contenedorImagen.appendChild(imagen);
      tarjeta.appendChild(contenedorImagen);


      const cuerpo = document.createElement("div");
      cuerpo.className = "card-body d-flex flex-column p-3 text-start";


      const codigo = document.createElement("div");
      codigo.className = "text-secondary small mb-1 fw-semibold";
      codigo.style.fontSize = "0.75rem";
      codigo.textContent = producto.codigo;
      cuerpo.appendChild(codigo);

 
      const nombre = document.createElement("h3");
      nombre.className = "h6 card-title mb-2 text-truncate fw-bold";
      nombre.style.fontSize = "1.05rem";
      nombre.textContent = producto.nombre;
      cuerpo.appendChild(nombre);

  
      const categoria = document.createElement("span");
      categoria.className =
        "badge text-bg-light border border-secondary mb-2 align-self-start text-dark fw-bold";
      categoria.style.fontSize = "0.7rem";
      categoria.textContent = producto.categoria;
      cuerpo.appendChild(categoria);


      const precio = document.createElement("div");
      precio.className = "fw-bold fs-4 mb-0 text-dark";
      precio.textContent =
        "$" + producto.precio.toLocaleString("es-CL");
      cuerpo.appendChild(precio);

      const stock = document.createElement("div");
      stock.className = "small text-secondary mb-3 fw-semibold";
      stock.style.fontSize = "0.75rem";

      if (producto.stock > 0) {
        stock.textContent = "Stock: " + producto.stock + " · Disponible";
      } else {
        stock.textContent = "Stock: " + producto.stock + " · No disponible";
      }

      cuerpo.appendChild(stock);


      const espacio = document.createElement("div");
      espacio.className = "mt-auto";
      cuerpo.appendChild(espacio);



      const zonaCarrito = document.createElement("div");
      zonaCarrito.className = "mt-2";

      const cantidad = cantidadEnCarrito(producto.id);

      if (!producto.activo || producto.stock <= 0) {

        const boton = document.createElement("button");
        boton.className = "btn btn-sm btn-secondary w-100 fw-bold";
        boton.disabled = true;
        boton.textContent = "Sin stock";

        zonaCarrito.appendChild(boton);

      } else if (cantidad === 0) {
  
        const boton = document.createElement("button");
        boton.className = "btn btn-primary w-100 fw-bold text-dark";
        boton.textContent = "Agregar al carrito";

        boton.addEventListener("click", function () {
          agregarAlCarrito(producto.id);
        });

        zonaCarrito.appendChild(boton);

      } else {
  
        const controles = document.createElement("div");
        controles.className =
          "d-flex align-items-center justify-content-between border border-secondary rounded";

       
        const botonMenos = document.createElement("button");
        botonMenos.className =
          "btn btn-sm btn-light flex-fill p-1 border-0 fw-bold";
        botonMenos.textContent = "−";

        botonMenos.addEventListener("click", function () {
          quitarUnaUnidad(producto.id);
        });

        controles.appendChild(botonMenos);

        const textoCantidad = document.createElement("span");
        textoCantidad.className = "px-3 small fw-bold fs-6";
        textoCantidad.textContent = cantidad;
        controles.appendChild(textoCantidad);

   
        const botonMas = document.createElement("button");
        botonMas.className =
          "btn btn-sm btn-light flex-fill p-1 border-0 fw-bold";

        if (!puedeAgregarMas(producto)) {
          botonMas.disabled = true;
        }

        botonMas.textContent = "+";

        botonMas.addEventListener("click", function () {
          agregarAlCarrito(producto.id);
        });

        controles.appendChild(botonMas);
        zonaCarrito.appendChild(controles);


        if (!puedeAgregarMas(producto)) {
          const nota = document.createElement("div");
          nota.className = "text-danger mt-1 fw-bold text-center";
          nota.style.fontSize = "0.7rem";

          if (producto.categoria === "Consolas") {
            nota.textContent = "Límite: 2 unids.";
          } else {
            nota.textContent = "Límite: 3 unids.";
          }

          zonaCarrito.appendChild(nota);
        }
      }

      cuerpo.appendChild(zonaCarrito);



      if (esAdmin) {
        const acciones = document.createElement("div");
        acciones.className =
          "d-flex gap-2 mt-3 pt-2 border-top border-light";

        const botonEditar = document.createElement("button");
        botonEditar.className =
          "btn btn-sm btn-outline-primary flex-fill fw-bold";
        botonEditar.textContent = "Editar";

        botonEditar.addEventListener("click", function () {
          editarProducto(producto.id);
        });

        const botonEliminar = document.createElement("button");
        botonEliminar.className =
          "btn btn-sm btn-outline-danger flex-fill fw-bold";
        botonEliminar.textContent = "Eliminar";

        botonEliminar.addEventListener("click", function () {
          eliminarProducto(producto.id);
        });

        acciones.appendChild(botonEditar);
        acciones.appendChild(botonEliminar);
        cuerpo.appendChild(acciones);
      }


      tarjeta.appendChild(cuerpo);
      columna.appendChild(tarjeta);
      contenedor.appendChild(columna);

      mostrados++;
    }


    if (mostrados === 0) {
      const mensaje = document.createElement("div");
      mensaje.className =
        "col-12 text-center text-white py-4 fw-bold fs-5";
      mensaje.style.textShadow = "1px 1px 3px rgba(0,0,0,0.8)";
      mensaje.textContent =
        "No hay productos que coincidan con la búsqueda.";

      contenedor.appendChild(mensaje);
    }
  }


  function mostrarAviso(mensaje, tipo) {
    const aviso = document.getElementById("aviso");

    aviso.className = "alert alert-" + tipo + " fw-bold";
    aviso.textContent = mensaje;

    setTimeout(function () {
      aviso.classList.add("d-none");
    }, 3000);
  }

 
  function mostrarError(mensaje) {
    const error = document.getElementById("errorForm");

    error.textContent = mensaje;
    error.classList.remove("d-none");
  }

  function buscarProducto(id) {
    for (let i = 0; i < productos.length; i++) {
      if (productos[i].id === id) {
        return productos[i];
      }
    }

    return null;
  }


  function nuevoProducto() {
    limpiarFormulario();

    document.getElementById("tituloForm").textContent = "Nuevo Producto";
    document.getElementById("panelForm").classList.remove("d-none");
    document.getElementById("prodCodigo").focus();
  }


  function editarProducto(id) {
    const producto = buscarProducto(id);

    if (!producto) {
      return;
    }

    limpiarFormulario();

    document.getElementById("tituloForm").textContent =
      "Editar un producto";

    document.getElementById("prodId").value = producto.id;
    document.getElementById("prodCodigo").value = producto.codigo;
    document.getElementById("prodNombre").value = producto.nombre;
    document.getElementById("prodCategoria").value = producto.categoria;
    document.getElementById("prodPrecio").value = producto.precio;
    document.getElementById("prodStock").value = producto.stock;
    document.getElementById("prodActivo").checked = producto.activo;

    if (producto.imagen) {
      document.getElementById("prodImagen").value = producto.imagen;
    }

    document.getElementById("panelForm").classList.remove("d-none");
    document.getElementById("prodNombre").focus();
  }


  function eliminarProducto(id) {
    const producto = buscarProducto(id);

    if (!producto) {
      return;
    }

    const confirmar = confirm(
      "¿Estás seguro de que deseas eliminar el producto '" +
      producto.nombre + "'?"
    );

    if (!confirmar) {
      return;
    }

    const nuevosProductos = [];

    for (let i = 0; i < productos.length; i++) {
      if (productos[i].id !== id) {
        nuevosProductos.push(productos[i]);
      }
    }

    productos = nuevosProductos;


    const nuevoCarrito = [];

    for (let i = 0; i < carrito.length; i++) {
      if (carrito[i].id !== id) {
        nuevoCarrito.push(carrito[i]);
      }
    }

    carrito = nuevoCarrito;

    guardarProductos();
    guardarCarrito();

    llenarCategorias();
    pintarCuadricula();
    pintarCarrito();

    mostrarAviso("Producto eliminado completamente", "danger");
  }


  function guardarProducto() {
    const id = document.getElementById("prodId").value;
    const codigo = document.getElementById("prodCodigo").value.trim();
    const nombre = document.getElementById("prodNombre").value.trim();
    const categoria = document.getElementById("prodCategoria").value.trim();
    const precio = document.getElementById("prodPrecio").value;
    const stock = document.getElementById("prodStock").value;
    const activo = document.getElementById("prodActivo").checked;
    const imagen = document.getElementById("prodImagen").value.trim();

  
    if (codigo === "" || nombre === "" || categoria === "") {
      mostrarError("Completa código, nombre y categoría");
      return;
    }

    if (precio === "" || isNaN(Number(precio))) {
      mostrarError("El precio debe ser un número");
      return;
    }

    if (Number(precio) < 0) {
      mostrarError("El precio no puede ser negativo");
      return;
    }

    if (stock === "" || isNaN(Number(stock))) {
      mostrarError("El stock debe ser un número");
      return;
    }

    if (Number(stock) < 0) {
      mostrarError("El stock no puede ser negativo");
      return;
    }


    if (id === "") {
      const nuevo = {
        id: siguienteId(),
        codigo: codigo,
        nombre: nombre,
        categoria: categoria,
        precio: Number(precio),
        stock: Number(stock),
        activo: activo,
        imagen: imagen
      };

      productos.push(nuevo);

      mostrarAviso("Producto creado", "success");

    } else {
  
      const producto = buscarProducto(Number(id));

      if (producto) {
        producto.codigo = codigo;
        producto.nombre = nombre;
        producto.categoria = categoria;
        producto.precio = Number(precio);
        producto.stock = Number(stock);
        producto.activo = activo;
        producto.imagen = imagen;

        mostrarAviso("Producto actualizado", "success");
      }
    }

    guardarProductos();
    llenarCategorias();
    pintarCuadricula();
    cerrarFormulario();
  }

  function cargarCarrito() {
    try {
      const texto = localStorage.getItem(KEY_CARRITO);

      if (!texto) {
        return [];
      }

      const datos = JSON.parse(texto);

      if (Array.isArray(datos)) {
        return datos;
      }

      return [];
    } catch (error) {
      return [];
    }
  }

  function guardarCarrito() {
    localStorage.setItem(KEY_CARRITO, JSON.stringify(carrito));
  }

  function itemEnCarrito(id) {
    for (let i = 0; i < carrito.length; i++) {
      if (carrito[i].id === id) {
        return carrito[i];
      }
    }

    return null;
  }


  function cantidadEnCarrito(id) {
    const item = itemEnCarrito(id);

    if (item) {
      return item.cantidad;
    }

    return 0;
  }


  function puedeAgregarMas(producto) {
    if (!producto) {
      return false;
    }

    if (!producto.activo) {
      return false;
    }

    if (producto.stock <= 0) {
      return false;
    }

    const cantidad = cantidadEnCarrito(producto.id);

    if (cantidad >= producto.stock) {
      return false;
    }

    let limite = LIMITE_JUEGO;

    if (producto.categoria === "Consolas") {
      limite = LIMITE_CONSOLA;
    }

    if (cantidad >= limite) {
      return false;
    }

    return true;
  }


  function agregarAlCarrito(id) {
    const producto = buscarProducto(id);

    if (!puedeAgregarMas(producto)) {
      return;
    }

    const item = itemEnCarrito(id);

    if (item) {
      item.cantidad = item.cantidad + 1;
    } else {
      carrito.push({
        id: id,
        cantidad: 1
      });
    }

    guardarCarrito();
    pintarCuadricula();
    pintarCarrito();

    mostrarAviso("Agregado al carrito", "success");
  }


  function quitarUnaUnidad(id) {
    const item = itemEnCarrito(id);

    if (!item) {
      return;
    }

    item.cantidad = item.cantidad - 1;

    if (item.cantidad <= 0) {
      quitarDelCarrito(id);
      return;
    }

    guardarCarrito();
    pintarCuadricula();
    pintarCarrito();
  }


  function quitarDelCarrito(id) {
    const nuevoCarrito = [];

    for (let i = 0; i < carrito.length; i++) {
      if (carrito[i].id !== id) {
        nuevoCarrito.push(carrito[i]);
      }
    }

    carrito = nuevoCarrito;

    guardarCarrito();
    pintarCuadricula();
    pintarCarrito();
  }


  function vaciarCarrito() {
    if (carrito.length === 0) {
      return;
    }

    if (!confirm("¿Vaciar todo el carrito?")) {
      return;
    }

    carrito = [];

    guardarCarrito();
    pintarCuadricula();
    pintarCarrito();
  }


  function finalizarCompra() {
    if (carrito.length === 0) {
      mostrarAviso("Tu carrito está vacío", "warning");
      return;
    }


    for (let i = 0; i < carrito.length; i++) {
      const item = carrito[i];
      const producto = buscarProducto(item.id);

      if (!producto || producto.stock < item.cantidad) {
        let nombre = "un producto";

        if (producto) {
          nombre = producto.nombre;
        }

        mostrarAviso(
          'El stock de "' + nombre +
          '" cambió, revisa tu carrito.',
          "danger"
        );

        return;
      }
    }

  
    for (let i = 0; i < carrito.length; i++) {
      const item = carrito[i];
      const producto = buscarProducto(item.id);

      producto.stock = producto.stock - item.cantidad;
    }

    guardarProductos();

    alert("Compra realizada (demo). ¡Gracias por tu compra!");

    carrito = [];
    guardarCarrito();

    pintarCuadricula();
    pintarCarrito();
  }


  function pintarCarrito() {
    const lista = document.getElementById("listaCarrito");
    const badge = document.getElementById("badgeCarrito");
    const total = document.getElementById("totalCarrito");

    lista.innerHTML = "";

    let totalUnidades = 0;
    let totalPrecio = 0;

    if (carrito.length === 0) {
      const mensaje = document.createElement("p");
      mensaje.className =
        "text-secondary small text-center mt-4 fw-bold";
      mensaje.textContent = "Tu carrito está vacío";

      lista.appendChild(mensaje);
    }

    for (let i = 0; i < carrito.length; i++) {
      const item = carrito[i];
      const producto = buscarProducto(item.id);

      if (!producto) {
        continue;
      }

      totalUnidades =
        totalUnidades + item.cantidad;

      totalPrecio =
        totalPrecio + item.cantidad * producto.precio;

      const fila = document.createElement("div");
      fila.className =
        "d-flex align-items-center gap-2 py-2 border-bottom border-secondary";

  
      const informacion = document.createElement("div");
      informacion.className = "flex-grow-1";

      const nombre = document.createElement("div");
      nombre.className = "small fw-bold text-white";
      nombre.textContent = producto.nombre;
      informacion.appendChild(nombre);

      const precio = document.createElement("div");
      precio.className = "small text-secondary fw-semibold";
      precio.textContent =
        "$" + producto.precio.toLocaleString("es-CL") + " c/u";
      informacion.appendChild(precio);

      const subtotal = document.createElement("div");
      subtotal.className = "small fw-bold";
      subtotal.style.color = "var(--zmart-amarillo)";
      subtotal.textContent =
        "Subtotal: $" +
        (producto.precio * item.cantidad).toLocaleString("es-CL");
      informacion.appendChild(subtotal);

      fila.appendChild(informacion);

      
      const controles = document.createElement("div");
      controles.className =
        "d-flex align-items-center gap-1";

      const botonMenos = document.createElement("button");
      botonMenos.className =
        "btn btn-sm btn-outline-light fw-bold";
      botonMenos.textContent = "−";

      botonMenos.addEventListener("click", function () {
        quitarUnaUnidad(producto.id);
      });

      controles.appendChild(botonMenos);

      const cantidad = document.createElement("span");
      cantidad.className = "px-2 fw-bold text-white";
      cantidad.textContent = item.cantidad;

      controles.appendChild(cantidad);

      const botonMas = document.createElement("button");
      botonMas.className =
        "btn btn-sm btn-outline-light fw-bold";
      botonMas.textContent = "+";

      if (!puedeAgregarMas(producto)) {
        botonMas.disabled = true;
      }

      botonMas.addEventListener("click", function () {
        agregarAlCarrito(producto.id);
      });

      controles.appendChild(botonMas);
      fila.appendChild(controles);

  
      const botonQuitar = document.createElement("button");
      botonQuitar.className =
        "btn btn-sm btn-outline-danger fw-bold";
      botonQuitar.textContent = "X";

      botonQuitar.addEventListener("click", function () {
        quitarDelCarrito(producto.id);
      });

      fila.appendChild(botonQuitar);

      lista.appendChild(fila);
    }

    badge.textContent = totalUnidades;
    total.textContent =
      "$" + totalPrecio.toLocaleString("es-CL");
  }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
